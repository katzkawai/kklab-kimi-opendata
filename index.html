<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドル/円 為替レート長期推移(1957年〜)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/date-fns@3.6.0/cdn.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
  body { font-family: "Helvetica Neue", "Hiragino Sans", "Yu Gothic", sans-serif;
         margin: 0; background: #f7f8fa; color: #222; }
  .container { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.4rem; margin-bottom: 4px; }
  .subtitle { color: #666; font-size: 0.9rem; margin-bottom: 16px; }
  .chart-card { background: #fff; border: 1px solid #e3e6ea; border-radius: 8px;
                padding: 16px; }
  .controls { margin-bottom: 12px; font-size: 0.9rem; }
  .controls label { margin-right: 16px; cursor: pointer; }
  .chart-wrap { position: relative; height: 480px; }
  footer { margin-top: 24px; font-size: 0.8rem; color: #888; line-height: 1.6; }
  a { color: #2b6cb0; }
</style>
</head>
<body>
<div class="container">
  <h1>ドル/円 為替レート長期推移</h1>
  <p class="subtitle">月末レート(円/ドル)、1957年1月〜。データ: IMF International Financial Statistics</p>

  <div class="chart-card">
    <div class="controls">
      <label><input type="checkbox" id="logScale"> 対数軸</label>
      <label>期間:
        <select id="range">
          <option value="all">全期間</option>
          <option value="50">直近50年</option>
          <option value="30">直近30年</option>
          <option value="10">直近10年</option>
        </select>
      </label>
    </div>
    <div class="chart-wrap"><canvas id="fxChart"></canvas></div>
  </div>

  <footer>
    <p>出典: IMF, International Financial Statistics (IFS), 指標コード ENDE_XDC_USD_RATE(月末、現地通貨/米ドル)。<br>
    データファイル: <a href="data/jpy_usd_monthly.csv">CSV</a> / <a href="data/jpy_usd_monthly.json">JSON</a><br>
    本ページはデータ可視化を目的としたものであり、投資助言ではありません。</p>
  </footer>
</div>

<script>
fetch('data/jpy_usd_monthly.json')
  .then(r => r.json())
  .then(payload => {
    const points = payload.data.map(([ym, v]) => ({ x: ym + '-01', y: v }));

    const chart = new Chart(document.getElementById('fxChart'), {
      type: 'line',
      data: { datasets: [{
        label: '円/ドル(月末)',
        data: points,
        borderColor: '#2b6cb0',
        borderWidth: 1.5,
        pointRadius: 0,
        pointHitRadius: 6,
        tension: 0.1
      }]},
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        scales: {
          x: { type: 'time', time: { unit: 'year' },
               ticks: { maxTicksLimit: 15 }, grid: { display: false } },
          y: { title: { display: true, text: '円/ドル' } }
        },
        plugins: {
          legend: { display: false },
          tooltip: { callbacks: {
            title: items => {
              const it = items[0];
              return chart.data.datasets[it.datasetIndex].data[it.dataIndex].x.slice(0, 7);
            },
            label: item => item.parsed.y.toLocaleString('ja-JP') + ' 円/ドル'
          }}
        }
      }
    });

    document.getElementById('logScale').addEventListener('change', e => {
      chart.options.scales.y.type = e.target.checked ? 'logarithmic' : 'linear';
      chart.update();
    });

    document.getElementById('range').addEventListener('change', e => {
      const years = e.target.value;
      if (years === 'all') {
        chart.data.datasets[0].data = points;
      } else {
        const cutoff = new Date();
        cutoff.setFullYear(cutoff.getFullYear() - Number(years));
        chart.data.datasets[0].data = points.filter(p => new Date(p.x) >= cutoff);
      }
      chart.update();
    });
  });
</script>
</body>
</html>
